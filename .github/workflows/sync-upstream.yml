name: Sync upstream and release UA version

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if tag already exists'
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync-and-release:
    name: Merge upstream, build & push Docker
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
      packages: write
      issues: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest upstream release tag
        id: upstream
        run: |
          TAG=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/seerr-team/seerr/releases/latest" \
            | jq -r '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not fetch upstream release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ua_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $TAG"

      - name: Check if fork already has this release
        id: check
        run: |
          UA_TAG="${{ steps.upstream.outputs.ua_tag }}"
          if git ls-remote --tags origin "refs/tags/$UA_TAG" | grep -q . \
              && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$UA_TAG already released — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add upstream remote and fetch tag
        if: steps.check.outputs.skip != 'true'
        run: |
          git remote add upstream https://github.com/seerr-team/seerr.git
          git fetch upstream "refs/tags/${{ steps.upstream.outputs.tag }}:refs/tags/_upstream-fetch"

      - name: Merge upstream tag into master
        if: steps.check.outputs.skip != 'true'
        id: merge
        run: |
          if git merge _upstream-fetch \
              --no-commit --no-edit; then
            git checkout HEAD -- .github/workflows/
            git commit -m "chore: merge upstream ${{ steps.upstream.outputs.tag }}" || true
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          git tag -d _upstream-fetch || true

      - name: Open issue on merge conflict
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.upstream.outputs.tag }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Merge conflict with upstream ${tag}`,
              body: [
                `Automatic merge of \`${tag}\` into \`master\` failed due to conflicts.`,
                '',
                '**Action needed:** resolve conflicts manually and push to `master`.',
                '',
                `Upstream release: https://github.com/seerr-team/seerr/releases/tag/${tag}`,
              ].join('\n'),
            });
            core.setFailed(`Merge conflict with upstream ${tag} — issue created`);

      - name: Restore fork-specific patches
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        run: |
          node -e "
            const fs = require('fs');

            // Restore Russian 💩
            const langFile = 'src/context/LanguageContext.tsx';
            let src = fs.readFileSync(langFile, 'utf8');
            src = src.replace(/display: 'p?[Рр]усс?ьк?[ийій]+(?:\s*💩)?'/, \"display: 'pусський 💩'\");
            fs.writeFileSync(langFile, src);

            // Patch Dockerfile: allow pnpm to install unlocked deps (we add cheerio, html-entities)
            const dockerfile = 'Dockerfile';
            let df = fs.readFileSync(dockerfile, 'utf8');
            df = df.replace(/pnpm install --prod --frozen-lockfile/g, 'pnpm install --prod --no-frozen-lockfile');
            df = df.replace(/pnpm install --frozen-lockfile/g, 'pnpm install --no-frozen-lockfile');
            fs.writeFileSync(dockerfile, df);
          "
          if ! git diff --quiet; then
            git commit -am "fix: restore fork patches after upstream merge"
          fi

      - name: Tag release and push
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        run: |
          UA_TAG="${{ steps.upstream.outputs.ua_tag }}"
          git tag "$UA_TAG" || echo "tag already exists"
          git push origin master
          git push origin "$UA_TAG" || git push --force origin "$UA_TAG"

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            COMMIT_TAG=${{ steps.upstream.outputs.ua_tag }}
          tags: |
            ghcr.io/mrkaktuz/seerr:latest
            ghcr.io/mrkaktuz/seerr:${{ steps.upstream.outputs.ua_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const upTag = '${{ steps.upstream.outputs.tag }}';
            const uaTag = '${{ steps.upstream.outputs.ua_tag }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: uaTag,
              });
              console.log(`Release ${uaTag} already exists, skipping`);
            } catch {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: uaTag,
                name: uaTag,
                target_commitish: 'master',
                body: [
                  `Based on upstream [${upTag}](https://github.com/seerr-team/seerr/releases/tag/${upTag}).`,
                  '',
                  '### Додатковий функціонал',
                  '- 🇺🇦 Перевірка наявності UA аудіо/субтитрів через [Kinobaza](https://kinobaza.com.ua)',
                  '',
                  '**Docker image (linux/amd64):**',
                  '```',
                  `docker pull ghcr.io/mrkaktuz/seerr:${uaTag}`,
                  '```',
                ].join('\n'),
                draft: false,
                prerelease: false,
              });
            }
