name: Sync upstream and release UA version

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if tag already exists'
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync-and-release:
    name: Merge upstream, build & push Docker
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      packages: write
      issues: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest upstream release tag
        id: upstream
        run: |
          TAG=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/seerr-team/seerr/releases/latest" \
            | jq -r '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not fetch upstream release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ua_tag=${TAG}-ua" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $TAG"

      - name: Check if fork already has this release
        id: check
        run: |
          UA_TAG="${{ steps.upstream.outputs.ua_tag }}"
          if git ls-remote --tags origin "refs/tags/$UA_TAG" | grep -q . \
              && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$UA_TAG already released — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add upstream remote and fetch tag
        if: steps.check.outputs.skip != 'true'
        run: |
          git remote add upstream https://github.com/seerr-team/seerr.git
          git fetch upstream "refs/tags/${{ steps.upstream.outputs.tag }}:refs/tags/_upstream-fetch"

      - name: Merge upstream tag into master
        if: steps.check.outputs.skip != 'true'
        id: merge
        run: |
          # Start the merge; tolerate conflicts so we can auto-resolve the
          # ones we always expect (deleted upstream workflows + patched files).
          git merge _upstream-fetch --no-commit --no-edit || true

          # 1. Workflow files: the fork keeps ONLY sync-upstream.yml. Upstream
          #    changes to other workflows show up as modify/delete conflicts —
          #    resolve every one of them in favour of our deletion.
          git ls-files -u -- .github/workflows \
            | awk '{print $4}' | sort -u \
            | while read -r f; do
                git rm -f --ignore-unmatch "$f" >/dev/null 2>&1 || true
              done
          git checkout HEAD -- .github/workflows/sync-upstream.yml
          git add .github/workflows/sync-upstream.yml

          # 2. Files we re-patch afterwards: take the upstream version now, the
          #    "Restore fork patches" step reapplies our changes on top.
          for f in Dockerfile \
                   src/context/LanguageContext.tsx \
                   src/components/Layout/VersionStatus/index.tsx; do
            if git ls-files -u -- "$f" | grep -q .; then
              git checkout --theirs -- "$f"
              git add "$f"
            fi
          done

          # 3. Anything still unmerged is a genuine source conflict we cannot
          #    resolve automatically.
          REMAINING="$(git diff --name-only --diff-filter=U)"
          if [ -n "$REMAINING" ]; then
            echo "::error::Unresolved conflicts:"
            echo "$REMAINING"
            # Issues are disabled on this fork, so make the details visible in
            # the run summary too — otherwise a failed sync is easy to miss.
            {
              echo "## 🚨 Merge conflict with upstream ${{ steps.upstream.outputs.tag }}"
              echo
              echo "Conflicting files:"
              echo '```'
              echo "$REMAINING"
              echo '```'
              echo "<details><summary>Conflict markers</summary>"
              echo
              echo '```diff'
              git diff --diff-filter=U | head -c 40000
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: merge upstream ${{ steps.upstream.outputs.tag }}" || true
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          git tag -d _upstream-fetch || true

      - name: Report merge conflict
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.upstream.outputs.tag }}';
            // Issues may be disabled on the fork; don't crash if so.
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Merge conflict with upstream ${tag}`,
                body: [
                  `Automatic merge of \`${tag}\` into \`master\` failed due to conflicts.`,
                  '',
                  '**Action needed:** resolve conflicts manually and push to `master`.',
                  '',
                  `Upstream release: https://github.com/seerr-team/seerr/releases/tag/${tag}`,
                ].join('\n'),
              });
            } catch (e) {
              console.log(`Could not open issue (${e.message}); see logs above for conflicts.`);
            }
            core.setFailed(`Merge conflict with upstream ${tag}`);

      - name: Restore fork-specific patches
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        run: |
          node <<'NODE'
          const fs = require('fs');

          const read = (f) => fs.readFileSync(f, 'utf8');
          const write = (f, s) => fs.writeFileSync(f, s);
          const assert = (cond, msg) => {
            if (!cond) {
              console.log(`::error::Fork patch failed: ${msg}`);
              process.exit(1);
            }
          };

          // Restore Russian 💩
          const langFile = 'src/context/LanguageContext.tsx';
          let src = read(langFile);
          src = src.replace(
            /display: 'p?[Рр]усс?ьк?[ийій]+(?:\s*💩)?'/,
            "display: 'pусський 💩'"
          );
          write(langFile, src);
          assert(src.includes("display: 'pусський 💩'"), `${langFile} — display string not patched`);

          // Patch Dockerfile: allow pnpm to install unlocked deps (we add cheerio, html-entities)
          const dockerfile = 'Dockerfile';
          let df = read(dockerfile);
          df = df.replace(/pnpm install --prod --frozen-lockfile/g, 'pnpm install --prod --no-frozen-lockfile');
          df = df.replace(/pnpm install --frozen-lockfile/g, 'pnpm install --no-frozen-lockfile');
          write(dockerfile, df);
          assert(!/(?<!no-)frozen-lockfile/.test(df), `${dockerfile} — --frozen-lockfile still present`);

          // Show the UA fork tag as a third line in the sidebar version block
          const vsFile = 'src/components/Layout/VersionStatus/index.tsx';
          let vs = read(vsFile);
          if (!vs.includes("data.commitTag !== 'local'")) {
            const anchor = '      </div>\n      {data.updateAvailable';
            assert(vs.includes(anchor), `${vsFile} — anchor for the commitTag block not found`);
            const block = [
              "        {data.commitTag && data.commitTag !== 'local' && (",
              '          <span className="truncate opacity-60">',
              '            <code className="bg-transparent p-0">{data.commitTag}</code>',
              '          </span>',
              '        )}',
              '',
            ].join('\n');
            vs = vs.replace(anchor, block + anchor);
            write(vsFile, vs);
          }
          assert(vs.includes('{data.commitTag}'), `${vsFile} — commitTag block missing`);
          NODE
          if ! git diff --quiet; then
            git commit -am "fix: restore fork patches after upstream merge"
          fi

      - name: Tag release and push
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        run: |
          UA_TAG="${{ steps.upstream.outputs.ua_tag }}"
          git tag "$UA_TAG" || echo "tag already exists"
          git push origin master
          git push origin "$UA_TAG" || git push --force origin "$UA_TAG"

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            COMMIT_TAG=${{ steps.upstream.outputs.ua_tag }}
          tags: |
            ghcr.io/mrkaktuz/seerr:latest
            ghcr.io/mrkaktuz/seerr:${{ steps.upstream.outputs.ua_tag }}
          cache-from: type=gha,scope=docker-${{ steps.upstream.outputs.ua_tag }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.upstream.outputs.ua_tag }}

      - name: Create GitHub release
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const upTag = '${{ steps.upstream.outputs.tag }}';
            const uaTag = '${{ steps.upstream.outputs.ua_tag }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: uaTag,
              });
              console.log(`Release ${uaTag} already exists, skipping`);
            } catch {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: uaTag,
                name: uaTag,
                target_commitish: 'master',
                body: [
                  `Based on upstream [${upTag}](https://github.com/seerr-team/seerr/releases/tag/${upTag}).`,
                  '',
                  '### Додатковий функціонал',
                  '- 🇺🇦 Перевірка наявності UA аудіо/субтитрів через [Kinobaza](https://kinobaza.com.ua)',
                  '',
                  '**Docker image (linux/amd64):**',
                  '```',
                  `docker pull ghcr.io/mrkaktuz/seerr:${uaTag}`,
                  '```',
                ].join('\n'),
                draft: false,
                prerelease: false,
              });
            }
